[project]
name = "insightflow-data"
version = "0.0.1"
description = "InsightFlow data service: uploads, Polars pipeline, dashboards and grounded briefs."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.0",
    "fastapi>=0.141.0",
    "fastexcel>=0.21.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "polars>=1.44.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.54",
    "structlog>=26.1.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.0",
    "moto[s3]>=5.2.0",
    "mypy>=2.3.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
    "testcontainers[postgres]>=4.15.0",
    "xlsxwriter>=3.2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["arq.*", "testcontainers.*", "moto.*", "fastexcel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
