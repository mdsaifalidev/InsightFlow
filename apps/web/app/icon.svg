<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2741a6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="1" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)" />
  <!-- Trend Flow Polyline -->
  <path
    d="M6.5 20.5 11.5 15.5l4.5 4 8-9"
    stroke="#ffffff"
    stroke-width="2.25"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Anomaly / Insight Highlight Node -->
  <circle cx="24" cy="10.5" r="2.75" fill="#f59e0b" filter="url(#glow)" />
</svg>
