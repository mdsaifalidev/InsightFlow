# InsightFlow API gateway (local development). See docs/ARCHITECTURE.md.
#   /             -> web (Next.js)
#   /api/auth/*   -> auth-node (Fastify)   [Phase 3]
#   /api/data/*   -> data-py (FastAPI)     [Phase 4]

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Resolve upstreams at request time via Docker's DNS, so nginx starts even
  # before the backend services exist (they return 502 until then).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Reuse the client's request ID or generate one; forwarded to every service.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  log_format main '$remote_addr "$request" $status $body_bytes_sent '
                  '$request_time rid=$req_id upstream=$upstream_addr';
  access_log /var/log/nginx/access.log main;

  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
  limit_req_status 429;

  client_max_body_size 100m;

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite rather than append ($proxy_add_x_forwarded_for). The services
    # run behind exactly this proxy and read the leftmost entry, so appending
    # would let a client forge its own IP and walk past every per-IP limit.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $req_id;
    add_header X-Request-ID $req_id always;

    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    location /api/auth/ {
      limit_req zone=auth_limit burst=20 nodelay;
      set $auth_upstream http://auth-node:4000;
      proxy_pass $auth_upstream;
    }

    # Server-Sent Events: no buffering, long-lived connections (ADR-008).
    location /api/data/jobs/ {
      set $data_upstream http://data-py:8000;
      proxy_pass $data_upstream;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location /api/data/ {
      limit_req zone=api_limit burst=100 nodelay;
      set $data_upstream http://data-py:8000;
      proxy_pass $data_upstream;
      # Stream large uploads straight to the service.
      proxy_request_buffering off;
      proxy_read_timeout 120s;
    }

    location / {
      set $web_upstream http://web:3000;
      proxy_pass $web_upstream;
      # WebSocket upgrade for Next.js hot reload.
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
